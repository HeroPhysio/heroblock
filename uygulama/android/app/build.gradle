apply plugin: 'com.android.application'

// Yükleme anahtarı (Google Play'e gönderilen paketi imzalar): android/keystore.properties dosyasından ya da ortam
// değişkenlerinden okunur. Anahtar ve şifreleri depoya KONMAZ.
def anahtarDosyasi = rootProject.file('keystore.properties')
def anahtar = new Properties()
if (anahtarDosyasi.exists()) { anahtarDosyasi.withInputStream { anahtar.load(it) } }
def ayar = { String ad, String ortam -> anahtar.getProperty(ad) ?: System.getenv(ortam) }

// Google AdMob: bütün kimlikler tek dosyada, uygulama/admob.config.json. Android uygulama kimliği her derlemede oradan
// okunup AndroidManifest'teki APPLICATION_ID'ye yazılır. Dosya yoksa Google'ın TEST uygulama kimliği kullanılır.
// Biçimi yanlış ya da başka hesaba ait bir kimlik varsa derleme durur (Android Studio'dan derlemede de).
def admobDosyasi = rootProject.file('../admob.config.json')
def admobAppId = 'ca-app-pub-3940256099942544~3347511713'
if (admobDosyasi.exists()) {
    def admob
    try {
        admob = new groovy.json.JsonSlurper().parse(admobDosyasi)
    } catch (Exception e) {
        throw new GradleException("admob.config.json okunamadı: ${e.message}")
    }
    def a = (admob instanceof Map && admob.android instanceof Map) ? admob.android : [:]
    def kimlik = a.appId?.toString()?.trim()
    def u = (kimlik ?: '') =~ /ca-app-pub-(\d{16})~\d{10}/
    if (!u.matches()) {
        throw new GradleException("admob.config.json: android.appId biçimi yanlış: '${kimlik}' (ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY olmalı)")
    }
    def yayinci = u.group(1)
    ['banner', 'interstitial', 'rewarded'].each { alan ->
        def v = a[alan]?.toString()?.trim()
        def m = (v ?: '') =~ /ca-app-pub-(\d{16})\/\d{10}/
        if (!m.matches()) {
            throw new GradleException("admob.config.json: android.${alan} biçimi yanlış: '${v}' (ca-app-pub-XXXXXXXXXXXXXXXX/YYYYYYYYYY olmalı)")
        }
        if (m.group(1) != yayinci && m.group(1) != '3940256099942544') {
            throw new GradleException("admob.config.json: android.${alan} başka bir AdMob hesabının birimi (birim ${m.group(1)}, uygulama ${yayinci})")
        }
    }
    admobAppId = kimlik
} else {
    logger.warn('admob.config.json bulunamadı: Google AdMob TEST uygulama kimliği kullanılıyor')
}

android {
    namespace = "tr.com.herouygulama.heroblock"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "tr.com.herouygulama.heroblock"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Sürüm: bulut derlemesinde -PhbSurumKodu=2 -PhbSurum=1.0.1 ile verilir (her Google Play yüklemesinde kod artmalı)
        versionCode((project.findProperty('hbSurumKodu') ?: '1') as Integer)
        versionName((project.findProperty('hbSurum') ?: '1.0.0') as String)
        // Google AdMob Android uygulama kimliği (yukarıda admob.config.json'dan okunur)
        manifestPlaceholders = [admobAppId: admobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (ayar('storeFile', 'HB_STORE_FILE')) {
                storeFile file(ayar('storeFile', 'HB_STORE_FILE'))
                storePassword ayar('storePassword', 'HB_STORE_PASSWORD')
                keyAlias ayar('keyAlias', 'HB_KEY_ALIAS')
                keyPassword ayar('keyPassword', 'HB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (ayar('storeFile', 'HB_STORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Oyunun reklam birimi kimliklerini okuduğu kopya: "npx cap sync" de koyar; Android Studio'dan doğrudan derlemede de
// admob.config.json ile aynı kalsın diye her derlemeden önce web dosyalarının yanına yeniden kopyalanır.
def admobKopyala = tasks.register('admobAyariniKopyala', Copy) {
    from(admobDosyasi)
    into(layout.projectDirectory.dir('src/main/assets/public'))
}
tasks.named('preBuild') { dependsOn(admobKopyala) }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
