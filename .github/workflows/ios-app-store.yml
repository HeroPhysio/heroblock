# Hero Block iOS uygulamasını GitHub'ın Mac sunucusunda (macOS 26, Xcode 26) derler, imzalar ve App Store Connect'e
# (TestFlight) yükler. Mac gerekmez: dağıtım sertifikasını ve profili Apple'ın bulut imzası, App Store Connect API anahtarıyla
# kendisi oluşturur (sertifika ya da profil dosyası hazırlanmaz).
#
# Çalıştırmak için: GitHub › Actions › "iOS · App Store Connect'e yükle" › Run workflow.
#   surum : App Store'da görünecek sürüm (ör. 1.0.11). Derleme numarası her çalıştırmada kendiliğinden artar.
#   yukle : işaretsizse yalnızca derleme denemesi yapılır (yükleme yok; Apple hesabı ve gizli bilgi gerekmez).
#
# Yükleme için gerekli gizli bilgiler (Settings › Secrets and variables › Actions › New repository secret):
#   APPLE_TEAM_ID              Apple geliştirici takım kimliği (10 karakter, developer.apple.com › Account › Membership details)
#   APPSTORE_API_KEY_ID        App Store Connect API anahtarının kimliği (Key ID)
#   APPSTORE_API_ISSUER_ID     App Store Connect API "Issuer ID"
#   APPSTORE_API_PRIVATE_KEY   İndirilen AuthKey_XXXX.p8 dosyasının içeriğinin tamamı (BEGIN/END satırları dahil)
# API anahtarı: App Store Connect › Kullanıcılar ve Erişim › Entegrasyonlar › App Store Connect API › Takım Anahtarları › "+".
#   Erişim: Admin (bulut imzası için gerekli). .p8 dosyası yalnızca bir kez indirilebilir.
#
# Reklam: uygulama/admob.config.json › ios bölümünde Google'ın test kimlikleri varken yükleme yapılmaz.
name: iOS · App Store Connect'e yükle

on:
  workflow_dispatch:
    inputs:
      surum:
        description: "App Store'da görünecek sürüm (ör. 1.0.11)"
        required: true
        default: "1.0.11"
      yukle:
        description: "İmzala ve App Store Connect'e yükle (işaretsiz: yalnızca derleme denemesi)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ios-app-store
  cancel-in-progress: false

jobs:
  ios:
    name: Derle, imzala, yükle
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: uygulama
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SURUM: ${{ inputs.surum }}
      DERLEME: ${{ github.run_number }}
      YUKLE: ${{ inputs.yukle }}
    steps:
      - uses: actions/checkout@v5

      - name: Sürüm biçimi
        run: |
          if ! [[ "$SURUM" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Sürüm 1.0.11 gibi olmalı (yazılan: '$SURUM')"; exit 1
          fi

      - name: Gizli bilgiler girilmiş mi
        if: inputs.yukle
        env:
          ASC_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          eksik=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_P8; do
            if [ -z "${!v}" ]; then echo "::error::Gizli bilgi eksik: $v (Settings › Secrets and variables › Actions)"; eksik=1; fi
          done
          exit $eksik

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uygulama/package-lock.json

      - name: Paketleri kur
        run: npm ci

      - name: iOS reklam kimliklerini denetle
        run: |
          node <<'JS'
          const a = require('./admob.config.json').ios || {};
          const test = ['appId', 'banner', 'interstitial', 'rewarded'].filter(k => String(a[k] || '').includes('3940256099942544'));
          if (!test.length) { console.log('iOS AdMob kimlikleri gerçek: ' + a.appId); process.exit(0); }
          const m = 'admob.config.json › ios bölümünde Google test kimlikleri var (' + test.join(', ') + '). AdMob › Uygulamalar ›'
            + ' Uygulama ekle › iOS ile Hero Block için uygulama ve 3 reklam birimi (banner, geçiş, ödüllü) oluşturup kimlikleri bu dosyaya yaz.';
          if (process.env.YUKLE === 'true') { console.log('::error::' + m + ' Test kimlikleriyle App Store Connect\'e yükleme yapılmaz.'); process.exit(1); }
          console.log('::warning::' + m);
          JS

      - name: Oyun dosyalarını ve reklam ayarını iOS projesine kopyala
        run: npx cap sync ios

      - name: Info.plist ve gizlilik dosyalarını denetle
        run: |
          P=ios/App/App
          plutil -lint $P/Info.plist $P/PrivacyInfo.xcprivacy $P/en.lproj/InfoPlist.strings $P/tr.lproj/InfoPlist.strings
          for k in GADApplicationIdentifier NSUserTrackingUsageDescription ITSAppUsesNonExemptEncryption; do
            printf '%s = ' "$k"; /usr/libexec/PlistBuddy -c "Print :$k" $P/Info.plist
          done
          test -f $P/public/index.html
          test -f $P/public/admob.config.json && cat $P/public/admob.config.json
          # Ses: arka planda ses izni yok ve oturum "ambient" (müzik uygulamasını durdurmaz, kilit ekranında medya kartı çıkmaz)
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" $P/Info.plist 2>/dev/null | grep -q audio; then
            echo "::error::Info.plist › UIBackgroundModes içinde 'audio' var: kaldırılmalı (oyun arka planda ses çalmaz)"; exit 1
          fi
          grep -q 'setCategory(.ambient' $P/AppDelegate.swift || { echo "::error::AppDelegate ses oturumunu .ambient yapmıyor"; exit 1; }
          if grep -q "audioSession.type = 'playback'" $P/public/index.html; then
            echo "::error::Oyun ses oturumunu playback'e alıyor: kilit ekranında medya kartı çıkar"; exit 1
          fi
          echo "Ses oturumu: ambient, arka plan sesi yok"

      - name: App Store Connect API anahtarını hazırla
        if: inputs.yukle
        env:
          ASC_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/anahtar"
          printf '%s\n' "$ASC_P8" > "$RUNNER_TEMP/anahtar/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/anahtar/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: Arşivle (sürüm ${{ inputs.surum }}, derleme ${{ github.run_number }})
        run: |
          ortak=(-project ios/App/App.xcodeproj -scheme App -configuration Release
                 -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HeroBlock.xcarchive"
                 -skipPackagePluginValidation -skipMacroValidation
                 MARKETING_VERSION="$SURUM" CURRENT_PROJECT_VERSION="$DERLEME")
          # Arşiv imzasız alınır; dağıtım imzasını dışa aktarımda Apple'ın bulut imzası atar (cihaz kaydı, sertifika ya da profil
          # dosyası gerekmez). Otomatik geliştirici imzası hesapta kayıtlı cihaz olmadan profil oluşturamıyor; iOS cihaz
          # derlemesinde geçici (ad hoc) imzaya da izin verilmiyor.
          xcodebuild archive "${ortak[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Gömülü kütüphanelerin eski imzalarını kaldır
        run: |
          # Google'ın hazır kütüphaneleri (GoogleMobileAds, UserMessagingPlatform) Google'ın imzasıyla gelir; arşivde ikili dosya
          # inceltildiği için bu imza bozulur ve içindeki "yalnızca Google'ın takımı" şartı dağıtım imzasına taşınırsa App Store
          # Connect yüklemeyi reddeder (Invalid Signature). Eski imza kaldırılınca dışa aktarım bunları bizim dağıtım imzamızla
          # baştan imzalar.
          A="$RUNNER_TEMP/HeroBlock.xcarchive/Products/Applications/App.app"
          for f in "$A"/Frameworks/*.framework "$A"/Frameworks/*.dylib; do
            [ -e "$f" ] || continue
            codesign --remove-signature "$f" 2>/dev/null || true
            rm -rf "$f/_CodeSignature"
            printf '%s: ' "${f##*/}"; codesign -dv "$f" 2>&1 | head -1
          done

      - name: Uygulama paketini denetle
        run: |
          A="$RUNNER_TEMP/HeroBlock.xcarchive/Products/Applications/App.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$A/Info.plist"
          test -f "$A/en.lproj/InfoPlist.strings" && test -f "$A/tr.lproj/InfoPlist.strings"
          test -f "$A/PrivacyInfo.xcprivacy" && test -f "$A/public/index.html" && test -f "$A/public/admob.config.json"
          ls "$A/Frameworks"
          echo "Takip izni açıklaması (İngilizce):"; plutil -p "$A/en.lproj/InfoPlist.strings"
          du -sh "$A"

      - name: İmzala ve App Store Connect'e yükle
        if: inputs.yukle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HeroBlock.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/cikti" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Yüklendi: sürüm $SURUM, derleme $DERLEME. App Store Connect › Hero Block › TestFlight'ta 10-30 dakika içinde görünür."

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/anahtar"
