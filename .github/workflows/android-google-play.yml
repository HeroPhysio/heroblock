# Hero Block Android uygulamasını (Google Play için AAB) derler ve yükleme anahtarıyla imzalar.
# Çıkan .aab dosyası çalıştırmanın "Artifacts" bölümünden indirilir ve Play Console'a yüklenir.
# Gerekli gizli bilgiler (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64    Yükleme anahtarı dosyasının (heroblock-yukleme-anahtari.jks) base64 hâli
#   ANDROID_KEYSTORE_PASSWORD  Yükleme anahtarının şifresi
name: Android · Google Play paketi (AAB)

on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm adı (ör. 1.0.1)"
        required: true
        default: "1.0.0"
      kod:
        description: "Sürüm kodu: her yüklemede bir öncekinden büyük olmalı (1, 2, 3...)"
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  android:
    name: Derle ve imzala
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: uygulama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketleri kur
        run: npm ci
      - name: Oyun dosyalarını Android projesine kopyala
        run: npx cap sync android
      - name: Yükleme anahtarını hazırla
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 eksik"; exit 1; }
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/yukleme.jks"
      - name: AAB derle (sürüm ${{ inputs.surum }}, kod ${{ inputs.kod }})
        working-directory: uygulama/android
        env:
          HB_STORE_FILE: ${{ runner.temp }}/yukleme.jks
          HB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HB_KEY_ALIAS: upload
          HB_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease -PhbSurum="${{ inputs.surum }}" -PhbSurumKodu="${{ inputs.kod }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hero-block-${{ inputs.surum }}-${{ inputs.kod }}-aab
          path: uygulama/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/yukleme.jks"
